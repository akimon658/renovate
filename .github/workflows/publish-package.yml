name: Build and Publish Custom Renovate

on:
  push:
    branches:
      - main-tangled

  workflow_dispatch:

env:
  NODE_VERSION: 24

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true
          runtime: node@${{ env.NODE_VERSION }}

      - run: pnpm build

      - name: Dynamically Rewrite package.json for Custom Release
        run: |
          node <<'EOF'
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

            const upstreamVersion = pkg.version;

            pkg.name = "@akimon658/renovate";

            pkg.version = `${upstreamVersion}-tangled.${process.env.GITHUB_RUN_NUMBER}`;

            pkg.publishConfig = {
              "registry": "https://npm.pkg.github.com",
              "access": "public"
            };

            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            console.log(`🚀 Patched package.json for custom release: ${pkg.name}@${pkg.version}`);
          EOF

      - name: Authenticate with GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc

      - name: Publish to GitHub Packages
        run: |
          pnpm publish --no-git-checks
