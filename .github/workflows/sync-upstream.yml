name: Sync Upstream

on:
  schedule:
    - cron: 0 20 * * *

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          runtime: node@24

      - name: Sync Mirror Branch
        run: |
          git remote add upstream https://github.com/renovatebot/renovate.git
          git fetch upstream
          git switch --track origin/main
          git reset --hard upstream/main
          git push origin main --force

      - name: Merge into Tangled Branch
        run: |
          git switch main-tangled

          if ! git merge main -m "Sync upstream changes"; then
            git checkout --theirs pnpm-lock.yaml
            pnpm install --lockfile-only
            git add pnpm-lock.yaml
            git commit --no-edit
          fi

          git push origin main-tangled
